<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Ölçüm grafiği kaynağı</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 1120px; background: #f7f7f4; }
    svg { display: block; width: 1600px; height: 1120px; }
    text { font-family: Arial, sans-serif; }
    .mono { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-label="Headless Chrome 154'te altı ölçümün aralık grafiği">
  <rect width="1600" height="1120" fill="#f7f7f4"/>
  <text x="96" y="82" fill="#55716b" font-size="16" font-weight="600" letter-spacing="2.4">BAĞIMSIZ DEMO · HEADLESS CHROMIUM 154 · n=6</text>
  <text x="96" y="153" fill="#17262c" font-size="52" font-weight="700" letter-spacing="-1.5">Aynı tıklama, iki farklı saat</text>
  <text x="96" y="202" fill="#56666c" font-size="25">DOM güncellemesi ile tarayıcı geçişinin bitişi aynı ölçüm değil.</text>

  <rect x="80" y="256" width="1440" height="735" rx="24" fill="#fff" stroke="#e0e1dc" stroke-width="2"/>
  <text x="128" y="321" fill="#25363d" font-size="23" font-weight="700">Tıklamadan sonra geçen süre</text>
  <text x="128" y="356" fill="#76827f" font-size="17">Her çizgi altı denemenin min–maks aralığıdır. Noktalar ölçüm sınırlarını gösterir.</text>
  <circle cx="1190" cy="318" r="10" fill="#d96e4e"/><text x="1211" y="325" fill="#43545b" font-size="18" font-weight="600">Motion</text>
  <circle cx="1327" cy="318" r="10" fill="#397cc4"/><text x="1348" y="325" fill="#43545b" font-size="18" font-weight="600">React</text>

  <text x="640" y="405" fill="#76827f" font-size="17" text-anchor="middle">Milisaniye (ms)</text>
  <g stroke="#e7e9e4" stroke-width="2">
    <line x1="640" y1="438" x2="640" y2="892"/><line x1="778" y1="438" x2="778" y2="892"/>
    <line x1="917" y1="438" x2="917" y2="892"/><line x1="1055" y1="438" x2="1055" y2="892"/>
    <line x1="1193" y1="438" x2="1193" y2="892"/><line x1="1332" y1="438" x2="1332" y2="892"/>
    <line x1="1470" y1="438" x2="1470" y2="892"/>
  </g>
  <g fill="#74807d" font-size="16" text-anchor="middle">
    <text x="640" y="921">0</text><text x="778" y="921">50</text><text x="917" y="921">100</text>
    <text x="1055" y="921">150</text><text x="1193" y="921">200</text><text x="1332" y="921">250</text><text x="1470" y="921">300</text>
  </g>

  <g>
    <text x="128" y="466" fill="#b85032" font-size="16" font-weight="700" letter-spacing=".5">MOTION · DOM MUTASYONU</text>
    <text x="128" y="502" fill="#24363c" font-size="23" font-weight="700">Seçili sekme işareti</text>
    <text x="128" y="531" fill="#74807d" font-size="16">6 tıklama · durum işareti</text>
    <line x1="643.3" y1="492" x2="643.9" y2="492" stroke="#d96e4e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="643.3" cy="492" r="9" fill="#d96e4e"/><circle cx="643.9" cy="492" r="9" fill="#d96e4e"/>
    <text x="671" y="500" fill="#b85032" font-size="19" font-weight="700">1,2–1,4 ms</text>
  </g>
  <g>
    <text x="128" y="594" fill="#b85032" font-size="16" font-weight="700" letter-spacing=".5">MOTION · DOM MUTASYONU</text>
    <text x="128" y="630" fill="#24363c" font-size="23" font-weight="700">Yeni panel başlığı</text>
    <text x="128" y="659" fill="#74807d" font-size="16">6 tıklama · mode="wait"</text>
    <line x1="1370.1" y1="620" x2="1376.9" y2="620" stroke="#d96e4e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1370.1" cy="620" r="9" fill="#d96e4e"/><circle cx="1376.9" cy="620" r="9" fill="#d96e4e"/>
    <text x="1445" y="602" fill="#b85032" font-size="18" font-weight="700" text-anchor="end">263,9–266,1 ms</text>
  </g>
  <g>
    <text x="128" y="722" fill="#2869ae" font-size="16" font-weight="700" letter-spacing=".5">REACT · DOM MUTASYONU</text>
    <text x="128" y="758" fill="#24363c" font-size="23" font-weight="700">Sekme + başlık birlikte</text>
    <text x="128" y="787" fill="#74807d" font-size="16">6 tıklama · aynı gözlem grubu</text>
    <line x1="646.6" y1="748" x2="650.5" y2="748" stroke="#397cc4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="646.6" cy="748" r="9" fill="#397cc4"/><circle cx="650.5" cy="748" r="9" fill="#397cc4"/>
    <text x="676" y="756" fill="#2869ae" font-size="19" font-weight="700">2,4–3,8 ms</text>
  </g>
  <g>
    <text x="128" y="850" fill="#2869ae" font-size="16" font-weight="700" letter-spacing=".5">REACT · TARAYICI GEÇİŞİ</text>
    <text x="128" y="886" fill="#24363c" font-size="23" font-weight="700">ViewTransition.finished</text>
    <text x="128" y="915" fill="#74807d" font-size="16">6 tıklama · DOM zamanı değil</text>
    <line x1="1373.7" y1="876" x2="1421.9" y2="876" stroke="#397cc4" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1373.7" cy="876" r="9" fill="#397cc4"/><circle cx="1421.9" cy="876" r="9" fill="#397cc4"/>
    <text x="1450" y="853" fill="#2869ae" font-size="18" font-weight="700" text-anchor="end">265,2–282,6 ms</text>
  </g>

  <line x1="128" y1="952" x2="1472" y2="952" stroke="#e1e3de" stroke-width="2"/>
  <text x="128" y="980" fill="#304249" font-size="17" font-weight="700">Nasıl okunmalı?</text>
  <text x="270" y="980" fill="#596970" font-size="16">İlk üç satır DOM mutasyonunu; son satır görsel geçişin tamamlanmasını ölçer.</text>
  <text x="128" y="1032" fill="#64747a" font-size="16">Tek headless tarayıcı, programatik tıklamalar. Boyama, gerçek girdi gecikmesi ve kullanıcı algısı ölçülmedi.</text>
  <text x="128" y="1071" fill="#55716b" font-size="15" font-weight="700" letter-spacing="1.2">KÜÇÜK TEKNİK DENEY · PERFORMANS LİDER TABLOSU DEĞİL</text>
</svg>
</body>
</html>
